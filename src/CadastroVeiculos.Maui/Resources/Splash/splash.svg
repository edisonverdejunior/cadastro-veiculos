<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Sedan silhouette: splash variant with hub detail -->
    <!-- Body (rounded rectangle) -->
    <rect x="38" y="200" width="380" height="78" rx="16" fill="white" />
    <!-- Cabin roof (trapezoid) -->
    <polygon points="140,118 316,118 382,200 74,200" fill="white" />
    <!-- Rear wheel -->
    <circle cx="142" cy="292" r="44" fill="white" />
    <!-- Front wheel -->
    <circle cx="332" cy="292" r="44" fill="white" />
    <!-- Rear hub ring (cutout) -->
    <circle cx="142" cy="292" r="18" fill="#1B2A4A" />
    <!-- Front hub ring (cutout) -->
    <circle cx="332" cy="292" r="18" fill="#1B2A4A" />
    <!-- Rear hub center dot -->
    <circle cx="142" cy="292" r="8" fill="white" />
    <!-- Front hub center dot -->
    <circle cx="332" cy="292" r="8" fill="white" />
</svg>